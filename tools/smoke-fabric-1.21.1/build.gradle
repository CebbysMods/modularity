// In-game smoke test: runs a dedicated server and a client with Modularity + a mod under test
// (-PmodJar=path/to/mod.jar), places content and takes screenshots. See .github/workflows/smoke.yml.
plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.9'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.110.0+1.21.1'

    modRuntimeOnly 'lv.cebbys.mcmods:modularity-fabric-1.21.1:0.1.0-SNAPSHOT'
    // -PwithKleeSlabs: also load KleeSlabs (+ Balm) to test the refabslab integration in game.
    if (providers.gradleProperty('withKleeSlabs').isPresent()) {
        modRuntimeOnly 'maven.modrinth:kleeslabs:21.1.11+fabric-1.21.1'
        modRuntimeOnly 'maven.modrinth:balm:21.0.63+fabric-1.21.1'
    }
    def modJar = providers.gradleProperty('modJar')
    if (modJar.isPresent()) {
        modRuntimeOnly files(modJar.get())
    }
}

loom {
    runs {
        client {
            programArgs '--quickPlaySingleplayer', 'smoke', '--width', '1280', '--height', '720'
        }
    }
}
