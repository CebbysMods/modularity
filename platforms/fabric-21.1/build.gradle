plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

def minecraftVersion = '1.21.1'
// Platform name uses the short version (21.1), like 26.x versions are named.
def platformName = 'fabric-21.1'

base {
    archivesName = "modularity-${platformName}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 1.21.1 runs on Java 21 - the lowest Java this platform can target.
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    api project(':modularity-api')
    // Separate mods, not nested: Modularity declares them in fabric.mod.json "depends".
    // Plain implementation: same build, already named, so Loom must not remap (and cache) them.
    implementation project(path: ':utilities:mvd:mvd-fabric', configuration: 'namedElements')
    implementation project(path: ':utilities:mpd:mpd-fabric', configuration: 'namedElements')
    // Development only (runClient): lists the loaded mods. Not a dependency of the published jar.
    modLocalRuntime 'com.terraformersmc:modmenu:11.0.5'
    include project(':modularity-api')
}

processResources {
    def props = [version: project.version, minecraft_version: minecraftVersion]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand(props)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
