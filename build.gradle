// utilities/ (mvd, mpd) configure themselves, so they can later move to their own repositories.
configure(subprojects.findAll { !it.path.startsWith(':utilities') }) {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

configure([project(':modularity-api'), project(':modularity-testkit')]) {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(Integer.parseInt(rootProject.java_toolchain)) }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        // Bytecode targets the lowest Java any supported Minecraft version runs on (see gradle.properties).
        options.release = Integer.parseInt(rootProject.java_api_release)
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all', '-Xlint:-serial']
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
            }
        }
    }
}

// The 3 mod jars of a release (Modularity, mvd, mpd), next to each other in build/libs-all/.
if (findProject(':platforms:fabric-21.1') != null) {
    tasks.register('collectJars', Sync) {   // Sync: removes jars of renamed or removed projects
        group = 'build'
        description = 'Copies the Modularity, mvd and mpd mod jars to build/libs-all/'
        [':platforms:fabric-21.1', ':utilities:mvd:mvd-fabric', ':utilities:mpd:mpd-fabric'].each { path ->
            from(project(path).tasks.named('remapJar'))
        }
        into layout.buildDirectory.dir('libs-all')
    }
}
