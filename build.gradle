plugins {
    // Configures the platforms of gradle/platforms.toml. It also brings Loom 1.19.3 (build-logic/build.gradle)
    // onto the root classpath, so every project (platforms) shares one Loom: subprojects apply
    // net.fabricmc.fabric-loom-remap / net.fabricmc.fabric-loom without a version.
    id 'lv.cebbys.modularity.root'
    // Test pyramid report (docs/07, 7.11). The adapter is applied to the test modules only; the aggregate report
    // reads the copies that allureCollectResults stages into build/allure-results.
    id 'io.qameta.allure-adapter' version '4.3.0' apply false
    id 'io.qameta.allure-aggregate-report' version '4.3.0'
}

subprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

// The API, the testkit and the smoke guest: Java 17, no loader and no Minecraft on the compile path.
configure([project(':modularity-api'), project(':modularity-testkit'), project(':modularity-smoke')]) {
    apply plugin: 'java-library'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(Integer.parseInt(rootProject.java_toolchain)) }
    }

    tasks.withType(JavaCompile).configureEach {
        // Bytecode targets the lowest Java any supported Minecraft version runs on (see gradle.properties).
        options.release = Integer.parseInt(rootProject.java_api_release)
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all', '-Xlint:-serial']
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

// Only the two libraries are published; the smoke module is a test fixture.
configure([project(':modularity-api'), project(':modularity-testkit')]) {
    apply plugin: 'maven-publish'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
            }
        }
    }
}

// The API and the testkit run the L1 unit tests, so they write Allure results. The smoke module has no tests, and a
// platform project's test task would pull in its whole Loom class path, so neither gets the adapter.
configure([project(':modularity-api'), project(':modularity-testkit')]) {
    apply plugin: 'io.qameta.allure-adapter'

    allure {
        adapter {
            // 3.x adapter line: allure-jupiter over allure-junit-platform (allure-junit5 is 2.x only).
            allureJavaVersion = '3.1.1'
            // No @Step/@Attachment in test code, so the AspectJ weaver is not needed.
            aspectjWeaver = false
        }
    }
}

// The aggregate plugin links itself to every project of the build. That would resolve the class path of every
// platform, which needs Minecraft and the network. The staged directory replaces those links (see the root plugin).
configurations.configureEach { configuration ->
    if (configuration.name in ['allureReport', 'allureGenerateCategories']) {
        configuration.withDependencies { dependencies -> dependencies.clear() }
    }
}

tasks.named('allureAggregateReport') {
    description = 'Writes one Allure HTML report from the collected L1, L2 and L3 results'
    // Raw results from every layer, staged by allureCollectResults. Without it the plugin would read the project
    // dependencies cleared above, which is nothing.
    resultsDirs.setFrom(layout.buildDirectory.dir('allure-results'))
    dependsOn 'allureCollectResults'
}

// buildAll also runs the plugin unit tests (layer ordering, override and duplicate checks, table, metadata).
tasks.named('buildAll') { dependsOn gradle.includedBuild('build-logic').task(':test') }
