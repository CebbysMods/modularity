name: in-game smoke test
on:
  workflow_dispatch:
  push:
    branches: [feature/milestone-1-core-api]
  pull_request:

jobs:
  # Every platform of gradle/platforms.toml: dedicated server; client where smoke-client = true (docs/07, 7.6).
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # 8: ForgeGradle 7 launches its runs with slime-launcher, which is pinned to Java 8; 21: toolchain of the
      # 1.21.x platforms; 25 (last = default): Gradle, Loom 1.19, the 26.x platforms and Forge's mavenizer.
      # setup-java writes every version to ~/.m2/toolchains.xml, so Gradle finds all three by itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglx-mesa0
      - name: Smoke tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew smokeAll --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-platforms
          path: |
            platforms/*/versions/*/build/smoke/*.txt
            platforms/*/versions/*/build/smoke/*.log
            platforms/*/versions/*/build/smoke/run/screenshots/
