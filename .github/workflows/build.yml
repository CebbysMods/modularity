name: build

on:
  push:
    branches: [release/1.0.0]
  pull_request:
  workflow_dispatch:

# No step needs to write to the repository.
permissions:
  contents: read

# A newer run of the same branch or pull request replaces the older one.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover platforms
    uses: ./.github/workflows/discover-platforms.yml

  # One job per enabled platform. Each job builds only its own platform.
  build:
    name: ${{ matrix.id }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # 21: toolchain of the 1.21.x platforms; 25 (last = default): Gradle/Loom 1.19 and the 26.x platforms.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test ${{ matrix.id }}
        run: ./gradlew -Pmodularity.platforms=${{ matrix.id }} buildAll --stacktrace
      # Kept when a build fails: the reports name the failing test.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.id }}
          path: |
            **/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  # The universal jar of a version merges the jars of every loader of that version, so one per-platform job cannot
  # produce it. This job builds with every enabled platform, which also keeps the merge free of artifact shuffling.
  collect:
    name: Universal jars
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Fail when a platform build failed
        if: ${{ !cancelled() && needs.build.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v7
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Collect universal jars
        run: ./gradlew -Pmodularity.platforms=all collectJars --stacktrace
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: modularity
          path: build/libs-all/
          retention-days: 7
