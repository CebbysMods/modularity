name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 21: toolchain of the 1.21.x platforms; 25 (last = default): Gradle/Loom 1.19 and the 26.x platforms.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew buildAll collectJars --stacktrace
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: modularity
          path: build/libs-all/
