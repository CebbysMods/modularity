org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

group=lv.cebbys.mcmods
version=0.1.0-SNAPSHOT

junit_version=5.10.3

# The Allure Java adapter line (docs/07, 7.11). The test modules set it from this property, and the test
# fixtures of modularity-api compile the custom label annotation against it.
allure_java_version=3.1.1

# Java policy: every jar targets the LOWEST Java version its Minecraft versions can run on, so players
# never need a newer Java than their Minecraft version ships with.
#   API, testkit (used by every target): Java 17 = minimum of Minecraft 1.18 - 1.20.4
#   platforms: the Java of their Minecraft version (1.20.5+ = 21), set in each platform build
# The toolchain only compiles; any JDK >= the highest release works.
java_api_release=17
java_toolchain=21
