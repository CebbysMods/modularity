pluginManagement {
    // Our own plugins (docs/07-multi-version-build.md).
    includeBuild 'build-logic'
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Provisions a toolchain the machine does not have (JDK 8 for ForgeGradle's slime launcher, 21 and 25 for the
    // platforms). CI installs those itself and Gradle finds them through ~/.m2/toolchains.xml.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    // Includes one project per platform of gradle/platforms.toml.
    id 'lv.cebbys.modularity.settings'
}

rootProject.name = 'modularity'

// Loader independent modules, buildable with nothing but Maven Central.
include 'modularity-api'
include 'modularity-testkit'

// Utility mods (see docs/06-utility-mods.md). Self-contained: they never reference the root project.
include 'utilities:mvd:mvd-core'
include 'utilities:mpd:mpd-core'

// Fabric platforms come from gradle/platforms.toml (settings plugin above); the utility wrappers need the
// same mavens. Skip all of them with -Pmodularity.platforms=none (e.g. in offline environments).
def platforms = providers.gradleProperty('modularity.platforms').getOrElse('all')
if (platforms != 'none') {
    include 'utilities:mvd:mvd-fabric'
    include 'utilities:mpd:mpd-fabric'
    include 'utilities:mvd:mvd-neoforge'
    include 'utilities:mpd:mpd-neoforge'
    include 'utilities:mvd:mvd-forge'
    include 'utilities:mpd:mpd-forge'
}
