pluginManagement {
    // Our own plugins (docs/07-multi-version-build.md).
    includeBuild 'modularity-gradle'
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Provisions a toolchain the machine does not have (JDK 8 for ForgeGradle's slime launcher, 21 and 25 for the
    // platforms). CI installs those itself and Gradle finds them through ~/.m2/toolchains.xml.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    // Includes one project per platform of gradle/platforms.toml.
    id 'lv.cebbys.modularity.settings'
}

rootProject.name = 'modularity'

// Loader independent modules, buildable with nothing but Maven Central. The smoke module holds the guest mod
// (compiled here) and the layered smoke roots, which each platform assembles (docs/07, 7.6).
include 'modularity-api'
include 'modularity-testkit'
include 'modularity-smoke'

// The platform projects come from gradle/platforms.toml (settings plugin above). Skip all of them with
// -Pmodularity.platforms=none (e.g. in offline environments).
