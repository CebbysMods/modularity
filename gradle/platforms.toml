# Platforms built by the lv.cebbys.modularity plugins (build-logic/, docs/07-multi-version-build.md).
# Values from meta.fabricmc.net and maven.fabricmc.net (newest Fabric API build per exact version) and
# Mojang's version manifest (Java), checked 2026-11-06. Never guess them: re-check when adding a version.
# smoke-client = true: smokeAll also runs the client smoke test (docs/07, 7.6).
# enabled = false: not ported yet (still selectable with -Pmodularity.platforms=<loader>-<name>).
# loader = fabric (default) | quilt | neoforge | forge; project :platforms:<loader>-<name>.
# Fabric/Quilt: fabric-api per platform, loader versions in [defaults]; NeoForge/Forge: neoforge/forge per platform.

[defaults]
fabric-loader = "0.20.1"
# fabricloader dependency of the Fabric jars: the API they use is old and stable; Quilt Loader 0.30.2 reports
# Fabric Loader 0.19.5. Same floor as mvd and mpd.
fabric-loader-min = "0.16.0"
# Quilt Loader: newest stable from meta.quiltmc.org, checked 2026-11-06.
quilt-loader = "0.30.2"

[mod]
id = "modularity"
archive-prefix = "modularity"
name = "Modularity"
description = "Multi version, multi loader modding API."
license = "MIT"
authors = ["CebbyS"]
icon = "images/modularity.png"
mixin-package = "lv.cebbys.mcmods.modularity.platform.mixin"
# Nested in the jar and exposed as api.
nested = [":modularity-api"]
# Separate mods next to Modularity (not nested), see docs/06-utility-mods.md.
mods = [":utilities:mvd:mvd-fabric", ":utilities:mpd:mpd-fabric"]

[mod.entrypoints]
main = ["lv.cebbys.mcmods.modularity.fabric.ModularityFabric"]
client = ["lv.cebbys.mcmods.modularity.fabric.client.ModularityFabricClient"]
server = ["lv.cebbys.mcmods.modularity.fabric.ModularityFabricServer"]
# Guest mods (modularity.mod.json only) become Fabric mods before the game starts.
preLaunch = ["lv.cebbys.mcmods.modularity.fabric.guest.GuestMods"]

[mod.depends]
mvd = ">=4.0.0"
mpd = ">=1.0.0"

