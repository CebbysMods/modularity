// Minecraft Version Detector (mvd). Shared settings of the mvd-* modules. Must not reference the Modularity root project,
// so the folder can later become its own repository.
// Properties of this folder's gradle.properties, passed down explicitly (Gradle 10 drops the implicit lookup in parents).
def shared = ['mvd_group', 'mvd_version', 'java_release', 'junit_version', 'minecraft_version', 'fabric_loader_version']
    .collectEntries { [it, property(it)] }

subprojects {
    shared.each { k, v -> ext.set(k, v) }
    group = shared['mvd_group']
    version = shared['mvd_version']

    repositories {
        mavenCentral()
    }
}
