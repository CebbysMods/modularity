plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'maven-publish'
}

description = 'Minecraft Platform Detector: NeoForge mod'

base {
    archivesName = 'mpd-neoforge'
}

def javaRelease = Integer.parseInt(project.property('java_release'))

java {
    toolchain { languageVersion = JavaLanguageVersion.of(javaRelease) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaRelease
    options.encoding = 'UTF-8'
}

neoForge {
    version = project.property('neoforge_version')
}

configurations {
    // mpd-core is packed into this jar, so the mod is a single file (as in mpd-fabric).
    bundle
    compileOnly.extendsFrom bundle
    runtimeOnly.extendsFrom bundle
}

dependencies {
    bundle project(':utilities:mpd:mpd-core')
}

jar {
    dependsOn configurations.bundle
    from({ configurations.bundle.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
        // This mod's own services file already lists the core's sources.
        exclude 'META-INF/services/**'
    }
}

processResources {
    def props = [version: project.version, minecraft_version: project.property('minecraft_version')]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
